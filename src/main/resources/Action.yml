#物品ID
下品灵石:
  Id: '下品灵石' #物品Id从Ni插件的物品库查找
  action: ['F','left','right']  #可以添加使用方式
  # 可用的动作有 F(切换物品键使用) left(左键) right(右键) shift(潜行)
  time: 5 #手持物品按下按键后读条的时间 默认为0秒 切换物品重置
  command: "nye give %player% lingqi 10 as console" #执行完后执行的命令
  progress-action: lingqi_absorb #吸收灵气进度事件，供 HorizonKKGuide/Chemdah 任务监听
  Loop: true #循环 会自动触发吸收灵石
  # as op 为op执行
  # 不添加则为普通玩家执行
  # as console 为控制台执行
  amount: 1 #执行完后扣除的数量 默认为0 如果为1 则扣除当前物品
  text: '可吸收灵石' #返回的文字变量信息
  move: false


轻身术:
  Id: '轻身术' #物品Id从Ni插件的物品库查找
  action: ['right']  #可以添加使用方式
  # 可用的动作有 F(切换物品键使用) left(左键) right(右键) shift(潜行)
  time: 10 #手持物品按下按键后读条的时间 默认为0秒 切换物品重置
  command: "lp user %player% permission set 轻身术 as console" #执行完后执行的命令
  # as op 为op执行
  # 不添加则为普通玩家执行
  # as console 为控制台执行
  amount: 1 #执行完后扣除的数量 默认为0 如果为1 则扣除当前物品
  text: '可阅读该书籍' #返回的文字变量信息
  permission: '轻身术' #如果有该权限时
  permission-text: '已阅读该书籍'


